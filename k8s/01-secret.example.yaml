# Plantilla del Secret de la base de datos. No contiene la contraseña real.
# Crear el Secret real (no versionado) con una de estas opciones:
#   1) cp k8s/01-secret.example.yaml k8s/01-secret.yaml, completar y aplicar
#   2) kubectl -n kube-news create secret generic postgres-credentials \
#        --from-literal=POSTGRES_DB=kubedevnews \
#        --from-literal=POSTGRES_USER=kubedevnews \
#        --from-literal=POSTGRES_PASSWORD="<contraseña>"
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: kube-news
type: Opaque
stringData:
  POSTGRES_DB: kubedevnews
  POSTGRES_USER: kubedevnews
  POSTGRES_PASSWORD: "<cambiar>"
